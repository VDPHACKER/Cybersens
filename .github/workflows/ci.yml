name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Typage, tests, build et audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Vérification du formatage
        run: npm run format:check

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests d'intégration de l'API
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Recherche de secrets dans le build
        run: |
          if grep -rE "AIza[0-9A-Za-z_-]{35}" dist/; then
            echo "Une clé API Google a été trouvée dans le build !" && exit 1
          fi

  docker:
    name: Image Docker et test de santé
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cybersens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrage et vérification de /api/health
        run: |
          docker run -d --name cybersens -p 8080:8080 cybersens:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker logs cybersens
          exit 1

      - name: Vérification des en-têtes de sécurité
        run: |
          headers=$(curl -sI http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi "content-security-policy"
          echo "$headers" | grep -qi "x-frame-options: DENY"

      - name: Analyse de vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cybersens:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
